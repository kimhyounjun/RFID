<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>결제하기 - 24H Smart Store</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container": "#eceef1",
                        "secondary-fixed-dim": "#b1c7f2",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e6",
                        "on-secondary-container": "#445a7f",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#a8c8ff",
                        "on-error": "#ffffff",
                        "surface": "#f7f9fc",
                        "surface-dim": "#d8dadd",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#703700",
                        "tertiary-fixed-dim": "#ffb782",
                        "background": "#f7f9fc",
                        "primary": "#005bb0",
                        "on-primary-fixed": "#001b3c",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#001b3c",
                        "on-primary-container": "#fefcff",
                        "tertiary-container": "#b55d00",
                        "tertiary": "#904900",
                        "surface-container-low": "#f2f4f7",
                        "primary-fixed": "#d6e3ff",
                        "primary-container": "#2574d2",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#00468a",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2d3133",
                        "secondary-container": "#bcd2fd",
                        "on-tertiary-fixed": "#301400",
                        "outline": "#727784",
                        "outline-variant": "#c1c6d4",
                        "tertiary-fixed": "#ffdcc5",
                        "secondary": "#495f84",
                        "on-surface-variant": "#414752",
                        "surface-variant": "#e0e3e6",
                        "inverse-on-surface": "#eff1f4",
                        "surface-container-high": "#e6e8eb",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d6e3ff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#a8c8ff",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fc",
                        "on-secondary-fixed-variant": "#31476b",
                        "surface-tint": "#005eb4"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 40;
        }

        .bg-abstract {
            background-color: #f7f9fc;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 91, 176, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(37, 116, 210, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(168, 200, 255, 0.03) 0%, transparent 60%);
        }

        .blurred-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }
    </style>
</head>

<body class="font-body bg-abstract text-on-surface min-h-screen flex flex-col relative overflow-hidden">
    <div class="blurred-circle bg-primary-fixed-dim w-[500px] h-[500px] -top-40 -left-20 opacity-30"></div>
    <div class="blurred-circle bg-secondary-container w-[400px] h-[400px] bottom-10 right-0 opacity-20"></div>

    <div class="absolute bottom-20 left-10 opacity-20 rotate-12 scale-75 hidden md:block">
        <div class="w-40 h-56 bg-surface-container rounded-xl shadow-lg border border-white/20"></div>
    </div>
    <div class="absolute top-40 right-10 opacity-20 -rotate-6 scale-90 hidden md:block">
        <div class="w-32 h-32 bg-secondary-container rounded-full shadow-lg border border-white/20"></div>
    </div>

    <header class="flex justify-between items-center w-full max-w-screen-2xl mx-auto pt-8 px-12 z-10">
        <div class="text-2xl font-bold text-on-surface font-headline">Self-Checkout</div>
        <div class="flex items-center gap-6">
            <span class="font-headline text-lg font-semibold tracking-tight text-primary">결제 단계</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 z-10">
        <div class="bg-white/80 backdrop-blur-2xl w-full max-w-2xl rounded-[2.5rem] shadow-[0px_24px_48px_-12px_rgba(25,28,30,0.08)] p-10 flex flex-col gap-8 border border-white/50">
            <div class="flex flex-col gap-1">
                <h1 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface">결제하기</h1>
                <p class="text-on-surface-variant font-medium text-lg">Scanned Items</p>
            </div>

            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low transition-colors">
                    <div class="flex flex-col">
                        <span class="text-xl font-semibold text-on-surface">삼각김밥</span>
                        <span class="text-sm text-on-surface-variant font-medium">1개</span>
                    </div>
                    <span class="text-xl font-bold font-headline text-on-surface">₩1,500</span>
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low transition-colors">
                    <div class="flex flex-col">
                        <span class="text-xl font-semibold text-on-surface">바나나맛 우유</span>
                        <span class="text-sm text-on-surface-variant font-medium">1개</span>
                    </div>
                    <span class="text-xl font-bold font-headline text-on-surface">₩1,700</span>
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low transition-colors">
                    <div class="flex flex-col">
                        <span class="text-xl font-semibold text-on-surface">새우깡</span>
                        <span class="text-sm text-on-surface-variant font-medium">1개</span>
                    </div>
                    <span class="text-xl font-bold font-headline text-on-surface">₩1,300</span>
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low transition-colors">
                    <div class="flex flex-col">
                        <span class="text-xl font-semibold text-on-surface">캔커피</span>
                        <span class="text-sm text-on-surface-variant font-medium">1개</span>
                    </div>
                    <span class="text-xl font-bold font-headline text-on-surface">₩2,200</span>
                </div>
            </div>

            <div class="mt-4 pt-8 border-t-2 border-dashed border-outline-variant flex flex-col gap-6">
                <div class="flex justify-between items-center">
                    <span class="text-xl font-medium text-on-surface-variant">총 결제 금액</span>
                    <span class="text-5xl font-extrabold font-headline text-primary tracking-tighter">₩6,700</span>
                </div>
                
                <button onclick="location.href='fourth.html'" class="w-full bg-gradient-to-b from-primary to-primary-container text-on-primary py-6 rounded-2xl text-2xl font-bold shadow-lg hover:opacity-90 transition-all active:scale-[0.98]">
                    결제하기
                </button>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-6 px-8 py-3 bg-white/40 backdrop-blur-md rounded-full border border-white/20 shadow-sm z-50">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500"></div>
            <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tighter">System Ready</span>
        </div>
        <div class="w-px h-3 bg-outline-variant"></div>
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-sm text-on-surface-variant">weight</span>
            <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tighter">Scale Active</span>
        </div>
    </footer>

    <button aria-label="Back" class="fixed bottom-8 left-8 w-16 h-16 flex items-center justify-center bg-white shadow-lg hover:bg-surface-container transition-all active:scale-90 group z-50 rounded-2xl border border-primary/10" onclick="location.href='second.html'">
        <span class="material-symbols-outlined text-primary text-4xl">
            arrow_back
        </span>
    </button>

    <button aria-label="Home" class="fixed bottom-8 right-8 w-16 h-16 flex items-center justify-center bg-white shadow-lg hover:bg-surface-container transition-all active:scale-90 group z-50 rounded-2xl border border-primary/10" onclick="location.href='first.html'">
        <span class="material-symbols-outlined text-primary text-4xl">
            home
        </span>
    </button>
</body>

</html>
