<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Console - Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#b1c7f2",
                        "surface-container-highest": "#e0e3e6",
                        "tertiary-container": "#b55d00",
                        "surface-container": "#eceef1",
                        "surface-bright": "#f7f9fc",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d6e3ff",
                        "inverse-on-surface": "#eff1f4",
                        "inverse-primary": "#a8c8ff",
                        "on-primary-container": "#fefcff",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#001b3c",
                        "on-tertiary-container": "#fffbff",
                        "background": "#f7f9fc",
                        "secondary": "#495f84",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "surface": "#f7f9fc",
                        "primary-fixed": "#d6e3ff",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e6e8eb",
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f7",
                        "on-secondary": "#ffffff",
                        "primary-container": "#2574d2",
                        "on-secondary-fixed-variant": "#31476b",
                        "primary-fixed-dim": "#a8c8ff",
                        "primary": "#005bb0",
                        "on-secondary-container": "#445a7f",
                        "tertiary-fixed-dim": "#ffb782",
                        "secondary-container": "#bcd2fd",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-tint": "#005eb4",
                        "on-tertiary-fixed-variant": "#703700",
                        "on-primary-fixed": "#001b3c",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "outline-variant": "#c1c6d4",
                        "on-surface-variant": "#414752",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d8dadd",
                        "surface-variant": "#e0e3e6",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#00468a",
                        "outline": "#727784",
                        "on-tertiary-fixed": "#301400",
                        "tertiary": "#904900"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .plus-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
        }

        .bg-abstract {
            background-color: #f7f9fc;
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 116, 210, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 91, 176, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 116, 210, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 91, 176, 0.05) 0px, transparent 50%);
        }
    </style>
</head>

<body class="bg-abstract font-body text-on-surface min-h-screen flex flex-col items-center overflow-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-5%] w-[40rem] h-[40rem] rounded-full border border-primary/10"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50rem] h-[50rem] rounded-full border border-primary/5"></div>
        <div class="absolute top-1/4 right-1/4 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl"></div>
    </div>

    <header class="fixed top-0 w-full flex justify-between items-center px-8 h-20 bg-white/10 backdrop-blur-xl z-50">
        <div class="flex items-center gap-4">
            <a class="flex items-center justify-center w-12 h-12 rounded-xl bg-white shadow-sm hover:bg-surface-container transition-all active:scale-95" href="first.html">
                <span class="material-symbols-outlined text-primary">arrow_back</span>
            </a>
            <h1 class="plus-jakarta font-bold text-lg text-blue-600">Admin Console</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center w-full max-w-6xl px-6 z-10 h-screen">
        <div class="glass-card w-full rounded-xl p-10 md:p-16 shadow-[0px_24px_48px_-12px_rgba(25,28,30,0.08)] flex flex-col items-center">
            <div class="text-center mb-12">
                <h2 class="text-headline font-extrabold text-4xl text-on-surface tracking-tight mb-3">Inventory Management</h2>
                <p class="text-on-surface-variant text-lg">Select an administrative task to perform</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full">
                <button onclick="location.href='add.html'" class="group flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-xl border border-transparent hover:border-primary/20 hover:bg-white shadow-sm hover:shadow-xl transition-all duration-300 active:scale-95">
                    <div class="w-20 h-20 rounded-2xl bg-primary/10 flex items-center justify-center mb-6 group-hover:bg-primary transition-colors duration-300">
                        <span class="material-symbols-outlined text-4xl text-primary group-hover:text-white">add_circle</span>
                    </div>
                    <span class="plus-jakarta font-bold text-xl text-on-surface">수량 추가</span>
                    <span class="text-sm text-on-surface-variant mt-2">Inventory replenishment</span>
                </button>

                <button onclick="location.href='code.html'" class="group flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-xl border border-transparent hover:border-primary/20 hover:bg-white shadow-sm hover:shadow-xl transition-all duration-300 active:scale-95">
                    <div class="w-20 h-20 rounded-2xl bg-primary/10 flex items-center justify-center mb-6 group-hover:bg-primary transition-colors duration-300">
                        <span class="material-symbols-outlined text-4xl text-primary group-hover:text-white">barcode_scanner</span>
                    </div>
                    <span class="plus-jakarta font-bold text-xl text-on-surface">코드 등록</span>
                    <span class="text-sm text-on-surface-variant mt-2">New product entry</span>
                </button>

                <button onclick="location.href='delete.html'" class="group flex flex-col items-center justify-center p-10 bg-surface-container-lowest rounded-xl border border-transparent hover:border-primary/20 hover:bg-white shadow-sm hover:shadow-xl transition-all duration-300 active:scale-95">
                    <div class="w-20 h-20 rounded-2xl bg-primary/10 flex items-center justify-center mb-6 group-hover:bg-primary transition-colors duration-300">
                        <span class="material-symbols-outlined text-4xl text-primary group-hover:text-white">delete</span>
                    </div>
                    <span class="plus-jakarta font-bold text-xl text-on-surface">상품 삭제</span>
                    <span class="text-sm text-on-surface-variant mt-2">Remove legacy data</span>
                </button>
            </div>

            <div class="mt-16 w-full grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-surface-container-low rounded-xl p-6 flex items-center gap-6">
                    <div class="flex-grow">
                        <span class="text-sm text-on-surface-variant block mb-1">Today's Total Tasks</span>
                        <span class="plus-jakarta text-3xl font-bold text-primary">124</span>
                    </div>
                    <div class="h-12 w-32 bg-primary/5 rounded-lg flex items-end p-1 gap-1">
                        <div class="bg-primary/20 w-full h-1/2 rounded-t-sm"></div>
                        <div class="bg-primary/20 w-full h-3/4 rounded-t-sm"></div>
                        <div class="bg-primary w-full h-full rounded-t-sm"></div>
                        <div class="bg-primary/60 w-full h-2/3 rounded-t-sm"></div>
                    </div>
                </div>
                <div class="bg-surface-container-low rounded-xl p-6 flex items-center gap-6">
                    <div class="flex-grow">
                        <span class="text-sm text-on-surface-variant block mb-1">Last Update</span>
                        <span class="plus-jakarta text-xl font-semibold text-on-surface">14:32:05</span>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-success/10 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary">sync</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
