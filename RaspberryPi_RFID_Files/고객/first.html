<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <title>Home - 24H Smart Store Service</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline": "#727784",
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#fffbff",
                        "on-surface-variant": "#414752",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#b1c7f2",
                        "surface-bright": "#f7f9fc",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e6e8eb",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef1",
                        "primary-container": "#2574d2",
                        "secondary-container": "#bcd2fd",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f7",
                        "on-primary-fixed-variant": "#00468a",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed-variant": "#31476b",
                        "secondary-fixed": "#d6e3ff",
                        "on-error": "#ffffff",
                        "primary": "#005bb0",
                        "surface-dim": "#d8dadd",
                        "surface": "#f7f9fc",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#001b3c",
                        "tertiary-fixed": "#ffdcc5",
                        "on-primary-container": "#fefcff",
                        "surface-tint": "#005eb4",
                        "on-secondary-fixed": "#001b3c",
                        "primary-fixed": "#d6e3ff",
                        "outline-variant": "#c1c6d4",
                        "tertiary": "#904900",
                        "inverse-primary": "#a8c8ff",
                        "tertiary-container": "#b55d00",
                        "on-secondary-container": "#445a7f",
                        "tertiary-fixed-dim": "#ffb782",
                        "background": "#f7f9fc",
                        "surface-container-highest": "#e0e3e6",
                        "inverse-on-surface": "#eff1f4",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#301400",
                        "primary-fixed-dim": "#a8c8ff",
                        "on-tertiary-fixed-variant": "#703700",
                        "surface-variant": "#e0e3e6",
                        "secondary": "#495f84",
                        "surface-container-lowest": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 48
        }

        .bg-abstract {
            background-color: #f0f4f9;
            background-image:
                radial-gradient(at 100% 100%, #e2eaf4 0px, transparent 50%),
                radial-gradient(at 0% 0%, #e8f0f8 0px, transparent 50%);
            position: relative;
            overflow: hidden;
        }

        .abstract-shape {
            position: absolute;
            background: rgba(180, 204, 232, 0.5);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }

        .shape-1 { width: 500px; height: 500px; top: -150px; left: -100px; }
        .shape-2 { width: 400px; height: 400px; bottom: -100px; right: -50px; }
        .shape-3 { width: 300px; height: 300px; top: 15%; right: 15%; background: rgba(160, 190, 230, 0.4); }
        .shape-4 { width: 250px; height: 250px; bottom: 20%; left: 5%; background: rgba(0, 91, 176, 0.15); }

        .deco-circle {
            position: absolute;
            border: 1.5px solid rgba(0, 91, 176, 0.25);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 채팅창 숨김/표시 애니메이션 */
        #chat-window {
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #chat-window.open {
            transform: translateX(0);
        }
    </style>
</head>

<body class="bg-abstract font-body text-on-background min-h-screen overflow-hidden cursor-pointer" id="home-page" onclick="location.href='second.html'">

    <div class="abstract-shape shape-1"></div>
    <div class="abstract-shape shape-2"></div>
    <div class="abstract-shape shape-3"></div>
    <div class="abstract-shape shape-4"></div>

    <div class="deco-circle w-24 h-24 top-20 left-[15%]"></div>
    <div class="deco-circle w-12 h-12 bottom-32 left-[10%]"></div>
    <div class="deco-circle w-40 h-40 bottom-10 right-[20%]"></div>
    <div class="deco-circle w-8 h-8 top-1/3 right-[5%]"></div>
    <div class="deco-circle w-32 h-32 top-[10%] left-[45%] opacity-50"></div>
    <div class="deco-circle w-20 h-20 bottom-[40%] right-[10%]"></div>
    <div class="deco-circle w-16 h-16 top-[60%] left-[25%] opacity-40"></div>

    <main class="relative z-10 min-h-screen flex items-center justify-center p-8 active:scale-[0.99] transition-transform duration-300" id="start-trigger">
        <div class="flex flex-col items-center justify-center text-center">
            <div class="relative mb-10">
                <div class="absolute inset-0 -m-8 border border-primary/10 rounded-full"></div>
                <div class="absolute inset-0 -m-4 border border-primary/20 rounded-full animate-pulse"></div>
                <div class="w-40 h-40 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center shadow-2xl shadow-primary/30 relative z-10">
                    <span class="material-symbols-outlined text-white text-7xl" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
                </div>
            </div>

            <div class="space-y-6">
                <h1 class="text-5xl md:text-6xl font-extrabold font-headline tracking-tight text-on-surface">
                    화면을 터치해주세요
                </h1>
                <p class="text-primary/60 text-xl font-bold tracking-[0.2em] uppercase">
                    Please touch the screen to start
                </p>
            </div>

            <div class="mt-20 flex flex-col items-center gap-3">
                <span class="material-symbols-outlined text-primary/40 text-5xl animate-bounce">expand_more</span>
                <div class="w-2 h-2 rounded-full bg-primary/30"></div>
            </div>
        </div>
    </main>

    <div id="chat-window" class="fixed top-1/4 right-8 w-80 h-[500px] bg-white rounded-3xl shadow-2xl z-[60] flex flex-col overflow-hidden border border-primary/10" onclick="event.stopPropagation()">
        <div class="bg-primary p-4 flex items-center justify-between text-white">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined">smart_toy</span>
                <span class="font-bold">스마트 도우미</span>
            </div>
            <button onclick="toggleChat()" class="hover:bg-white/20 rounded-full p-1 transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="flex-grow p-4 overflow-y-auto bg-slate-50 space-y-4">
            <div class="flex flex-col gap-1">
                <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[85%]">
                    안녕하세요! 24H 스마트 스토어에 오신 것을 환영합니다! 🤖
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[85%]">
                    상품 결제나 위치 등 궁금한 점이 있으신가요?
                </div>
            </div>
            <div class="flex flex-col gap-1 items-end">
                <div class="bg-primary text-white p-3 rounded-2xl rounded-tr-none text-sm shadow-sm max-w-[85%]">
                    이용 방법 좀 알려줘!
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[85%]">
                    바구니를 계산대에 올려두시면 자동으로 상품이 인식된답니다. 아주 쉽죠? ✨
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-100 bg-white">
            <div class="flex items-center bg-slate-100 rounded-full px-4 py-2 gap-2">
                <input id="chat-input" type="text" placeholder="메시지를 입력하세요" class="bg-transparent text-sm w-full outline-none">
            <button id="chat-send">
                <span class="material-symbols-outlined text-primary text-xl">send</span>
            </button>
            </div>
        </div>
    </div>

    <button aria-label="Chatbot" class="fixed bottom-[160px] right-[70px] w-16 h-16 flex items-center justify-center bg-primary text-white shadow-2xl hover:scale-110 transition-transform active:scale-95 z-50 rounded-2xl" onclick="event.stopPropagation(); toggleChat()">
        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">
            smart_toy
        </span>
        <span class="absolute -top-1 -right-1 w-5 h-5 bg-error rounded-full border-2 border-white animate-bounce"></span>
    </button>

    <script>
        // 채팅창 열고 닫기 함수
        function toggleChat() {
            const chatWin = document.getElementById('chat-window');
            chatWin.classList.toggle('open');
        }

            // ===== 챗봇 기능 추가 =====
        const chatInput = document.getElementById("chat-input");
        const chatSend = document.getElementById("chat-send");
        const chatContainer = document.querySelector("#chat-window .flex-grow");

            // 메시지 화면에 추가
        function addMessage(text, isUser) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex flex-col gap-1 " + (isUser ? "items-end" : "");

            const msg = document.createElement("div");
            msg.className = isUser
                ? "bg-primary text-white p-3 rounded-2xl rounded-tr-none text-sm shadow-sm max-w-[85%]"
                : "bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none text-sm shadow-sm max-w-[85%]";

            msg.innerHTML = text.replace(/\n/g, "<br>");
            wrapper.appendChild(msg);

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 메시지 보내기
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            chatInput.value = "";

            try {
                const API_BASE_URL = "https://walton-wharfless-lanie.ngrok-free.dev";
                const response = await fetch(API_BASE_URL + "/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: text }),
                });

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.reply, false);
                } else {
                    addMessage("서버 오류입니다.", false);
                }
            } catch (e) {
                addMessage("서버 연결 실패", false);
            }
        }

        // 버튼 클릭
        chatSend.addEventListener("click", sendMessage);

        // 엔터 입력
        chatInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>
    
    <script src="tts.js"></script>
</body>
</html>
