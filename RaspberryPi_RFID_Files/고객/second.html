    <script>
const scannedTagSet = new Set();
const scannedItems = [];
let detectionStarted = false;
const POLL_INTERVAL_MS = 200;

// 태그 → 상품정보
async function fetchProduct(tagId) {
    try {
        const resp = await fetch(API_BASE_URL + "/scan", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "any"
            },
            body: JSON.stringify({ rfid: tagId })
        });

        if (!resp.ok) return;

        const data = await resp.json();

        if (data && data.product) {
            scannedItems.push({
                tag_id: tagId,
                name: data.product.product_name,
                price: data.product.price
            });
        }
    } catch (e) {}
}

// 태그 감지
async function pollTags() {
    try {
        const resp = await fetch(LOCAL_API_URL + "/tags");

        if (resp.ok) {
            const data = await resp.json();
            const tags = data.tags || [];

            for (const tagId of tags) {
                if (tagId && !scannedTagSet.has(tagId)) {
                    scannedTagSet.add(tagId);

                    fetchProduct(tagId);

                    if (!detectionStarted) {
                        detectionStarted = true;

                        setTimeout(async () => {

                            // 👉 상품 데이터 받을 시간 확보
                            await new Promise(r => setTimeout(r, 500));

                            localStorage.setItem("cartData", JSON.stringify(scannedItems));
                            localStorage.setItem("scanActive", "true");

                            window.location.href = "third.html";

                        }, 2500);
                    }
                }
            }
        }
    } catch (e) {}

    setTimeout(pollTags, POLL_INTERVAL_MS);
}

// 스캔 시작 (로컬 통신 핵심)
async function startScan() {
    try {
        const resp = await fetch(LOCAL_API_URL + "/scan/start", {
            method: "POST"
        });

        if (resp.ok) {
            pollTags(); // 👉 여기서부터 태그 읽기 시작
        }
    } catch (e) {}
}

document.addEventListener("DOMContentLoaded", startScan);
</script>
